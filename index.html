
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Christina Amend | Geographic Information Science and Technology</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
/* ------------------ FULL STYLED DESIGN (same as previous version) ------------------ */
    :root {
      --bg: #050816;
      --bg-alt: #070b1d;
      --card-bg: rgba(10, 18, 40, 0.96);
      --accent: #4dd4ff;
      --accent-strong: #7ef29d;
      --accent-soft: rgba(77, 212, 255, 0.15);
      --text-main: #e5ebff;
      --text-muted: #9aa4c6;
      --border-soft: rgba(125, 145, 220, 0.35);
      --shadow-soft: 0 20px 45px rgba(0, 0, 0, 0.65);
      --radius-lg: 20px;
      --radius-pill: 999px;
      --max-width: 1120px;
    }
    *{box-sizing:border-box;}
    body {
      margin:0; padding:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      line-height:1.6; color:var(--text-main);
      background:
        radial-gradient(circle at 0% 0%, #1c2040 0, transparent 50%),
        radial-gradient(circle at 100% 0%, #12223d 0, transparent 45%),
        radial-gradient(circle at 50% 100%, #1a2b3f 0, transparent 55%),
        var(--bg);
      min-height:100vh;
    }
    .page{max-width:var(--max-width);margin:0 auto;padding:2.5rem 1.5rem 3rem;}
    header.hero{
      border-radius:26px;padding:2.6rem;color:#fff;box-shadow:var(--shadow-soft);
      background:linear-gradient(135deg,#070f25,#050816);
      border:1px solid rgba(133,155,255,0.35);
    }
    .hero-heading{font-size:2.6rem;text-transform:uppercase;margin:0;}
    .hero-heading span.highlight{
      background:linear-gradient(120deg,#7ef29d,#4dd4ff);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .hero-subheading{
      margin:.35rem 0 .5rem;font-size:1rem;max-width:36rem;color:rgba(231,239,255,0.9);
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <h1 class="hero-heading"><span class="highlight">Christina Amend</span></h1>

      <!-- UPDATED TEXT ONLY -->
      <p class="hero-subheading">
        Geographic Information Science and Technology student specializing in marine conservation, WebGIS, and spatial data visualization for the Gulf of Mexico.
      </p>

      <p style="font-size:0.88rem; opacity:0.8;">Portfolio snapshot — Updated 12/2025</p>
    </header>
  </div>
</body>
</html>
